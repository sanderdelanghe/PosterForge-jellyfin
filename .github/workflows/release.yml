name: Release

on:
  push:
    tags: ["v*"]   # e.g. v1.0.0.0 (Jellyfin wants four-part versions)

permissions:
  contents: write

env:
  TARGET_ABI: "12.0.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet publish Jellyfin.Plugin.PosterForge -c Release -o out -p:Version="$VERSION"
          zip -j "posterforge_$VERSION.zip" out/Jellyfin.Plugin.PosterForge.dll

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "posterforge_$VERSION.zip" --title "PosterForge $VERSION" --generate-notes

      - name: Add version to manifest.json
        run: |
          CHECKSUM=$(md5sum "posterforge_$VERSION.zip" | cut -d' ' -f1)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/posterforge_$VERSION.zip"
          NOTES=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")

          git fetch origin main
          git checkout -B main origin/main

          jq --arg v "$VERSION" --arg url "$URL" --arg sum "$CHECKSUM" --arg abi "$TARGET_ABI" \
             --arg log "${NOTES:-Release $VERSION}" --arg owner "$GITHUB_REPOSITORY_OWNER" \
             --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '.[0].owner = $owner
              | .[0].versions |= ([{version: $v, changelog: $log, targetAbi: $abi, sourceUrl: $url, checksum: $sum, timestamp: $ts}]
                                  + map(select(.version != $v)))' \
             manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for $VERSION"
          git push origin main
